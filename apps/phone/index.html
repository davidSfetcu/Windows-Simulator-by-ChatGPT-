<!-- Phone app -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Phone</title>
  <style>body{font-family:Segoe UI,Arial;background:#071a2e;color:#fff;padding:12px} .dial{display:flex;gap:8px;flex-wrap:wrap} .digit{width:60px;height:60px;background:#0e486f;border-radius:50;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;margin:6px;border-radius:999px}
  .log{margin-top:12px}
  button{padding:8px 12px;border-radius:6px;border:0;background:#0078d7;color:#fff}</style>
</head>
<body>
  <h3>Phone</h3>
  <div id="display" style="font-size:24px;margin-bottom:8px"></div>
  <div class="dial" id="dial"></div>
  <div style="margin-top:10px"><button id="call">Call</button> <button id="hang">Hang Up</button> <button id="simulate">Simulate Incoming</button></div>
  <div class="log"><h4>Call Log</h4><ul id="loglist"></ul></div>

  <script src="../../scripts/phone.js"></script>
</body>
</html>

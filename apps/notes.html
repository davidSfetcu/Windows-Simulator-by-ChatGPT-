<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <style>
      body{color:#fff;font-family:Segoe UI,Arial;background:transparent;padding:8px}
      textarea{width:100%;height:200px;border-radius:6px;padding:8px;border:0;resize:vertical}
      .actions{margin-top:8px;display:flex;gap:8px}
      button{padding:6px 10px;border-radius:6px;border:0;background:#1e90ff;color:#fff}
    </style>
  </head>
  <body>
    <h3>Notes</h3>
    <textarea id="note"></textarea>
    <div class="actions">
      <button id="save">Save</button>
      <button id="clear">Clear</button>
    </div>
  </body>
</html>
